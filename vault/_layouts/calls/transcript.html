<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ note.Title() }}</title>
  <style>
    :root { --bg: #fff; --fg: #1d1d1f; --muted: #6e6e73; --line: #e5e5ea; --accent: #0a66d8; --hl: #eef4ff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161618; --fg: #f2f2f7; --muted: #98989f; --line: #2c2c30; --accent: #5a9cff; --hl: #1f2a3d; }
    }
    body { background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; max-width: 820px; margin: 0 auto; padding: 0 16px 4rem; }
    header { position: sticky; top: 0; background: var(--bg); padding: 1rem 0 .75rem; border-bottom: 1px solid var(--line); z-index: 1; }
    h1 { font-size: 1.25rem; margin: 0 0 .25rem; }
    .meta { color: var(--muted); font-size: 13px; margin-bottom: .5rem; }
    audio { width: 100%; }
    .noaudio { color: var(--muted); font-size: 13px; }
    .turn { display: grid; grid-template-columns: 4.5rem 1fr; gap: .25rem .75rem; padding: .5rem .5rem; border-radius: 6px; }
    .turn.now { background: var(--hl); }
    .tc { font: 13px ui-monospace, monospace; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
    .tc:hover { text-decoration: underline; }
    .who { color: var(--muted); font-size: 12px; text-transform: lowercase; }
    .text { grid-column: 2; }
  </style>
</head>
<body>
  <header>
    <h1>{{ note.Title() }}</h1>
    <div class="meta" id="meta"></div>
    <div id="player"></div>
  </header>
  <main id="turns"></main>

  <!-- Rendered HTML: only used to find the uploaded audio URL trip2g put into the <audio> embed. -->
  <template id="rendered">{{ note.HTMLString() | unsafe }}</template>
  <script type="application/json" id="md">{{ json(note.ContentString()) | unsafe }}</script>
  <script>
  (function () {
    const md = JSON.parse(document.getElementById("md").textContent);
    const rendered = document.getElementById("rendered").content;

    // Frontmatter: a few fields for the header line.
    const fm = {};
    const body = md.replace(/^---\n([\s\S]*?)\n---\n?/, (_, block) => {
      for (const line of block.split("\n")) {
        const m = line.match(/^([a-z_]+):\s*"?(.*?)"?\s*$/);
        if (m) fm[m[1]] = m[2];
      }
      return "";
    });
    document.getElementById("meta").textContent =
      [fm.date, fm.duration && ("длительность " + fm.duration), fm.engine].filter(Boolean).join(" · ");

    // Turns: "Label | MM:SS" (or H:MM:SS / MMM:SS) followed by text until a blank line.
    const HEADER = /^(.{1,60}?) \| (\d{1,3}:\d{2}(?::\d{2})?)$/;
    const toSec = (tc) => tc.split(":").map(Number).reduce((a, n) => a * 60 + n, 0);
    const turns = [];
    let cur = null;
    for (const line of body.split("\n")) {
      const h = line.match(HEADER);
      if (h) { cur = { who: h[1], tc: h[2], at: toSec(h[2]), text: [] }; turns.push(cur); }
      else if (cur && line.trim()) cur.text.push(line.trim());
      else if (!line.trim()) cur = null;
    }

    // Player: the uploaded asset URL from the rendered embed.
    const src = rendered.querySelector("audio[src]")?.getAttribute("src");
    const player = document.getElementById("player");
    let audio = null;
    if (src) {
      audio = document.createElement("audio");
      audio.controls = true;
      audio.preload = "metadata";
      audio.src = src;
      player.appendChild(audio);
    } else {
      player.innerHTML = '<div class="noaudio">Аудио к этому звонку не загружено.</div>';
    }

    const list = document.getElementById("turns");
    const rows = turns.map((t) => {
      const row = document.createElement("div");
      row.className = "turn";
      row.id = "t" + t.at;
      const btn = document.createElement("button");
      btn.className = "tc";
      btn.textContent = t.tc;
      btn.title = "Слушать с " + t.tc;
      btn.addEventListener("click", () => seek(t.at, true));
      const who = document.createElement("div");
      who.className = "who";
      who.textContent = t.who;
      const text = document.createElement("div");
      text.className = "text";
      text.textContent = t.text.join(" ");
      row.append(btn, who, text);
      list.appendChild(row);
      return row;
    });

    // Timecodes are segment starts; start a little earlier so the first word isn't clipped.
    const LEAD = 1;
    function seek(at, play) {
      if (!audio) return;
      audio.currentTime = Math.max(0, at - LEAD);
      if (play) audio.play();
      history.replaceState(null, "", "#t=" + turns.find((t) => t.at === at)?.tc);
    }

    // Highlight the turn being played.
    if (audio) {
      let last = -1;
      audio.addEventListener("timeupdate", () => {
        const now = audio.currentTime + LEAD;
        let i = turns.length - 1;
        while (i > 0 && turns[i].at > now) i--;
        if (i === last) return;
        if (last >= 0) rows[last].classList.remove("now");
        rows[i]?.classList.add("now");
        last = i;
      });
    }

    // Deep link: #t=12:34
    const m = location.hash.match(/^#t=(\d{1,3}:\d{2}(?::\d{2})?)$/);
    if (m && audio) {
      const at = toSec(m[1]);
      audio.addEventListener("loadedmetadata", () => { audio.currentTime = Math.max(0, at - LEAD); }, { once: true });
      document.getElementById("t" + at)?.scrollIntoView({ block: "center" });
    }
  })();
  </script>
</body>
</html>
